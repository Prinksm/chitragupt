        client-id: 966586889081-ralgi6h3jd92v40he34f4p0b8sfoplta.apps.googleusercontent.com
        client-secret: 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
  flyway:
    enabled: true
    locations: classpath:db/migrations
  logging:
    level:
      org.flywaydb: DEBUG
jwt:
  secretKey : ${SECRET_KEY}
